[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntru-pytorch"
version = "0.1.0"
description = "Independent SymPy and PyTorch NTRU research implementations"
requires-python = ">=3.11"
dependencies = ["sympy>=1.14", "torch>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.17"]
plots = ["matplotlib>=3.10"]
cpu-sparse = ["numpy>=1.26,<2"]
hailo-export = ["numpy>=1.26", "onnx>=1.16", "onnxruntime>=1.18", "ml_dtypes>=0.5.4,<0.6"]
hailo-runtime = ["numpy>=1.26,<2"]

[project.scripts]
ntru-research = "ntru_pytorch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: large experimental parameter sets", "hailo_hardware: requires exact compiled NTRU HEF and Hailo device"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
